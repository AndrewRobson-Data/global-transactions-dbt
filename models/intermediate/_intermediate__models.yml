version: 2

models:
  - name: int_transactions_converted_to_gbp
    description: Transactions with amounts converted to GBP at the latest rate on or before the transaction date.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: rate_date
        description: Date of the rate used. Earlier than transaction_date when no same-day rate exists.
      - name: is_fallback_rate
        description: True when no rate existed for the transaction date.
      - name: amount_gbp
        description: Unsigned transaction amount in GBP.
        data_tests:
          - not_null

  - name: int_transactions_with_discount_status
    description: Transactions with running contract spend and the fee margin applied.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: is_in_contract
        description: True when the transaction falls within the client's contract dates.
      - name: payments_spend_before_gbp
        description: In-contract payments in GBP before this transaction. Same-day ties are ordered by transaction_id.
        data_tests:
          - not_null
      - name: original_payment_date
        description: For refunds, the date of the payment refunded.
      - name: is_discount_applied
        description: True when the discounted margin applies. Refunds inherit this from the payment they refund.
        data_tests:
          - not_null
      - name: applied_fee_margin
        data_tests:
          - not_null

unit_tests:
  - name: test_discount_starts_after_threshold_is_crossed
    description: >
      The payment that crosses the threshold stays at the default margin, later transactions get the discount,
      refunds use the margin of the payment they refund, and clients outside a contract are never discounted.
    model: int_transactions_with_discount_status
    given:
      - input: ref('int_transactions_converted_to_gbp')
        rows:
          - {transaction_id: T1, client_id: C1, transaction_type: payment, transaction_date: '2024-01-01', linked_transaction_id: null, amount_gbp: 60, platform_fee_margin: 0.2}
          - {transaction_id: T2, client_id: C1, transaction_type: payment, transaction_date: '2024-01-02', linked_transaction_id: null, amount_gbp: 50, platform_fee_margin: 0.2}
          - {transaction_id: T3, client_id: C1, transaction_type: payment, transaction_date: '2024-01-03', linked_transaction_id: null, amount_gbp: 10, platform_fee_margin: 0.2}
          - {transaction_id: T4, client_id: C1, transaction_type: refund, transaction_date: '2024-01-04', linked_transaction_id: T3, amount_gbp: 10, platform_fee_margin: 0.2}
          - {transaction_id: T5, client_id: C1, transaction_type: refund, transaction_date: '2024-01-04', linked_transaction_id: T1, amount_gbp: 60, platform_fee_margin: 0.2}
          - {transaction_id: T6, client_id: C1, transaction_type: chargeback, transaction_date: '2024-01-05', linked_transaction_id: null, amount_gbp: 5, platform_fee_margin: 0.2}
          - {transaction_id: T7, client_id: C1, transaction_type: payment, transaction_date: '2024-03-01', linked_transaction_id: null, amount_gbp: 5, platform_fee_margin: 0.2}
          - {transaction_id: T8, client_id: C2, transaction_type: payment, transaction_date: '2024-01-01', linked_transaction_id: null, amount_gbp: 1000, platform_fee_margin: 0.2}
          - {transaction_id: T9, client_id: C2, transaction_type: payment, transaction_date: '2024-01-02', linked_transaction_id: null, amount_gbp: 1000, platform_fee_margin: 0.2}
      - input: ref('stg_client_contracts')
        rows:
          - {client_id: C1, contract_start_date: '2024-01-01', contract_end_date: '2024-01-31', spend_threshold: 100, discounted_fee_margin: 0.1}
    expect:
      rows:
        - {transaction_id: T1, payments_spend_before_gbp: 0, is_discount_applied: 0, applied_fee_margin: 0.2}
        - {transaction_id: T2, payments_spend_before_gbp: 60, is_discount_applied: 0, applied_fee_margin: 0.2}
        - {transaction_id: T3, payments_spend_before_gbp: 110, is_discount_applied: 1, applied_fee_margin: 0.1}
        - {transaction_id: T4, payments_spend_before_gbp: 120, is_discount_applied: 1, applied_fee_margin: 0.1}
        - {transaction_id: T5, payments_spend_before_gbp: 120, is_discount_applied: 0, applied_fee_margin: 0.2}
        - {transaction_id: T6, payments_spend_before_gbp: 120, is_discount_applied: 1, applied_fee_margin: 0.1}
        - {transaction_id: T7, payments_spend_before_gbp: 120, is_discount_applied: 0, applied_fee_margin: 0.2}
        - {transaction_id: T8, payments_spend_before_gbp: 0, is_discount_applied: 0, applied_fee_margin: 0.2}
        - {transaction_id: T9, payments_spend_before_gbp: 0, is_discount_applied: 0, applied_fee_margin: 0.2}
